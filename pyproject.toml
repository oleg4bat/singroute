[project]
name = "singroute"
version = "0.7.0"
description = "Safe portable Windows GUI for synchronizing sing-box outbounds on OpenWrt routers."
authors = [{ name = "SingRoute contributors" }]
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "pyside6>=6.11.2,<7.0.0",
    "paramiko>=5.0.0,<6.0.0",
    "keyring>=25.7.0,<26.0.0",
]

[tool.poetry]
packages = [{ include = "singroute" }]
include = [
    { path = "singroute/application/update.ps1", format = ["sdist", "wheel"] },
    { path = "singroute/assets/singroute.svg", format = ["sdist"] },
    { path = "singroute/assets/singroute.ico", format = ["sdist"] },
    { path = "singroute/assets/singroute.png", format = ["sdist", "wheel"] },
    { path = "singroute/assets/chevron-up.svg", format = ["sdist"] },
    { path = "singroute/assets/chevron-down.svg", format = ["sdist"] },
    { path = "singroute/assets/chevron-up.png", format = ["sdist", "wheel"] },
    { path = "singroute/assets/chevron-down.png", format = ["sdist", "wheel"] },
]

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.3"
pyinstaller = "^6.22.2"
pip-audit = "^2.9.0"
pytest-cov = "^7.1.0"
ruff = "^0.16.4"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-p", "no:cacheprovider"]

[tool.coverage.run]
branch = true
source = ["singroute"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 70

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003", "SIM112"]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
