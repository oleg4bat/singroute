name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: python -m pip install poetry==2.4.1

      - name: Install dependencies
        run: poetry install --no-interaction --no-ansi

      - name: Check project metadata
        run: poetry check

      - name: Check code style
        run: poetry run ruff check .

      - name: Check formatting
        run: poetry run ruff format --check .

      - name: Run tests with branch coverage
        run: poetry run pytest -q --cov=singroute --cov-report=term-missing

      - name: Audit Python dependencies
        run: poetry run pip-audit

      - name: Build portable application
        shell: pwsh
        run: .\build.ps1

      - name: Test portable self-update and rollback
        shell: pwsh
        run: .\scripts\e2e_test_portable_update.ps1 dist\SingRoute.exe
