name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: windows-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Check out tagged revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: python -m pip install poetry==2.4.1

      - name: Verify tag matches project version
        shell: pwsh
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])"
          if ($env:GITHUB_REF_NAME -cne "v$version") {
              throw "Tag $env:GITHUB_REF_NAME does not match project version $version"
          }

      - name: Install dependencies
        run: poetry install --no-interaction --no-ansi

      - name: Check project metadata
        run: poetry check

      - name: Check code style
        run: poetry run ruff check .

      - name: Check formatting
        run: poetry run ruff format --check .

      - name: Run tests with branch coverage
        run: poetry run pytest -q --cov=singroute --cov-report=term-missing

      - name: Audit Python dependencies
        run: poetry run pip-audit

      - name: Build portable application
        shell: pwsh
        run: .\build.ps1

      - name: Test portable self-update and rollback
        shell: pwsh
        run: .\scripts\e2e_test_portable_update.ps1 dist\SingRoute.exe

      - name: Attest release binary
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: dist/SingRoute.exe

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create $env:GITHUB_REF_NAME `
            "dist/SingRoute.exe#Portable Windows application" `
            --verify-tag `
            --generate-notes `
            --title "SingRoute $env:GITHUB_REF_NAME"
