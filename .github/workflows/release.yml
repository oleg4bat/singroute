name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: windows-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Check out tagged revision
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: python -m pip install poetry==2.4.1

      - name: Verify tag matches project version
        shell: pwsh
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])"
          if ($env:GITHUB_REF_NAME -cne "v$version") {
              throw "Tag $env:GITHUB_REF_NAME does not match project version $version"
          }

      - name: Install dependencies
        run: poetry install --no-interaction --no-ansi

      - name: Check project metadata
        run: poetry check

      - name: Run tests
        run: poetry run pytest -q -p no:cacheprovider

      - name: Build portable application
        shell: pwsh
        run: .\build.ps1

      - name: Create SHA-256 checksum
        shell: pwsh
        run: |
          $asset = "dist/singbox-outbound-updater.exe"
          $digest = (Get-FileHash -LiteralPath $asset -Algorithm SHA256).Hash.ToLowerInvariant()
          "$digest  singbox-outbound-updater.exe" | Set-Content -Encoding ascii "${asset}.sha256"

      - name: Attest release binary
        uses: actions/attest@v4
        with:
          subject-path: dist/singbox-outbound-updater.exe

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create $env:GITHUB_REF_NAME `
            "dist/singbox-outbound-updater.exe#Portable Windows application" `
            "dist/singbox-outbound-updater.exe.sha256#SHA-256 checksum" `
            --verify-tag `
            --generate-notes `
            --title "sing-box Outbound Updater $env:GITHUB_REF_NAME"
